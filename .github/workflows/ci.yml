name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build logcat (Android)
        run: ./gradlew :logcat:assemble :logcat:testAndroidHostTest -Pkotlin.native.ignoreDisabledTargets=true

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build logcat (iOS)
        run: ./gradlew :logcat:compileKotlinIosArm64 :logcat:compileKotlinIosX64 :logcat:compileKotlinIosSimulatorArm64
