name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build logcat (Android)
        run: ./gradlew :logcat:assemble :logcat:test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build logcat (iOS)
        run: ./gradlew :logcat:compileKotlinIosArm64 :logcat:compileKotlinIosX64 :logcat:compileKotlinIosSimulatorArm64
